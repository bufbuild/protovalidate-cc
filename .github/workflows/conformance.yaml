name: Conformance
on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance Testing
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          disk-cache: true
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Make
        run: choco install make
        if: runner.os == 'Windows'
      - name: Install go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Test conformance
        run: make conformance
